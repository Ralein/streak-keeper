name: 🔥 Daily Streak Commit

on:
  schedule:
    # 5 runs a day (in IST):
    # - Morning (9:00 AM IST) -> 03:30 UTC
    # - Afternoon (1:00 PM IST) -> 07:30 UTC
    # - Evening (5:00 PM IST) -> 11:30 UTC
    # - Night (9:00 PM IST) -> 15:30 UTC
    # - Midnight (1:00 AM IST next day) -> 19:30 UTC
    - cron: "30 3 * * *"
    - cron: "30 7 * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"
    - cron: "30 19 * * *"

  # Allows manual trigger from GitHub UI or mobile app
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering manually?"
        required: false
        default: "Manual streak commit 🚀"

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔥 Run streak-keeper
        id: run_script
        run: python commit.py

      - name: 📦 Commit & Push
        run: |
          git config user.name "streak-keeper[bot]"
          git config user.email "streak-keeper@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🔥 streak: $(date +'%Y-%m-%d') (${{ steps.run_script.outputs.part_of_day || 'Manual' }}) — keeping it alive"
          git push
